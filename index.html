
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساحة الطالب الذكية</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts and Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Cairo', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#f0fdfa', 100: '#ccfbf1', 500: '#14b8a6', 600: '#0d9488', 900: '#134e4a' },
                        dark: { bg: '#0f172a', surface: '#1e293b', border: '#334155' }
                    }
                }
            }
        }
    </script>
    
    <!-- Custom Styles -->
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        
        body { font-family: 'Cairo', sans-serif; }
        
        .glass { 
            background: rgba(255, 255, 255, 0.9); 
            backdrop-filter: blur(10px); 
            border-bottom: 1px solid rgba(0, 0, 0, 0.05); 
        }
        .dark .glass { 
            background: rgba(30, 41, 59, 0.9); 
            border-bottom: 1px solid rgba(255, 255, 255, 0.05); 
        }
        
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 15px rgba(139, 92, 246, 0.5); transform: scale(1); }
            50% { box-shadow: 0 0 25px rgba(139, 92, 246, 0.8); transform: scale(1.05); }
        }
        .gemini-btn { 
            animation: pulse-glow 2.5s infinite; 
            background: linear-gradient(135deg, #8b5cf6, #3b82f6); 
        }
        
        .pdf-page {
            background-color: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            min-height: 842px; /* A4 height */
            width: 100%;
            max-width: 595px; /* A4 width */
        }
        .dark .pdf-page { 
            background-color: #f8fafc; 
            color: #1e293b; 
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-dark-bg dark:text-gray-100 transition-colors duration-300 h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="glass relative z-50 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3 cursor-pointer" id="logo-btn">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-brand-500 flex items-center justify-center text-white">
                <i class="fa-solid fa-book-open text-xl"></i>
            </div>
            <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-brand-600 to-teal-400">
                مساحة الطالب
            </h1>
        </div>
        
        <div class="flex items-center gap-4">
            <button id="theme-toggle" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 text-xl">
                <i class="fa-solid fa-moon dark:hidden"></i>
                <i class="fa-solid fa-sun hidden dark:block text-yellow-400"></i>
            </button>
            <div class="w-10 h-10 rounded-full bg-gray-300 overflow-hidden border-2 border-brand-500">
                <img src="https://placehold.co/100x100/14b8a6/ffffff?text=U" alt="User" class="w-full h-full object-cover">
            </div>
        </div>
    </header>

    <!-- Folders View -->
    <main id="foldersView" class="flex-1 p-6 lg:p-10 overflow-y-auto flex">
        <div class="max-w-7xl mx-auto w-full">
            <div class="flex justify-between items-end mb-8 border-b dark:border-gray-700 pb-4">
                <div>
                    <h2 class="text-3xl font-bold mb-2">ملفاتي الدراسية</h2>
                    <p class="text-gray-500 dark:text-gray-400">نظم محاضراتك وابدأ القراءة الذكية.</p>
                </div>
                <button class="bg-brand-500 hover:bg-brand-600 text-white px-5 py-2.5 rounded-xl font-bold flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> إضافة مجلد
                </button>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6" id="folders-container">
                <!-- Example Folder -->
                <div class="folder-item bg-white dark:bg-dark-surface border border-gray-200 dark:border-gray-700 rounded-2xl p-6 shadow-sm hover:shadow-lg transition-all cursor-pointer relative group">
                    <div class="flex justify-between items-start mb-4">
                        <div class="w-14 h-14 rounded-2xl bg-blue-100 dark:bg-blue-900/40 flex items-center justify-center text-blue-600 text-3xl group-hover:scale-110 transition-transform">
                            <i class="fa-solid fa-folder"></i>
                        </div>
                        <button class="menu-trigger text-gray-400 hover:text-brand-500 p-2">
                            <i class="fa-solid fa-ellipsis-vertical"></i>
                        </button>
                    </div>
                    <h3 class="font-bold text-xl mb-1">علم التشريح</h3>
                    <p class="text-sm text-gray-500">3 محاضرات</p>
                    
                    <!-- Context Menu -->
                    <div class="folder-menu absolute left-4 top-14 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-600 rounded-lg shadow-xl w-32 z-10 flex-col overflow-hidden hidden">
                        <button class="text-right px-4 py-2 text-sm hover:bg-gray-100 dark:hover:bg-gray-700"><i class="fa-solid fa-pen mr-2"></i> تعديل</button>
                        <button class="text-right px-4 py-2 text-sm hover:bg-gray-100 dark:hover:bg-gray-700 text-red-500"><i class="fa-solid fa-trash mr-2"></i> حذف</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Reader View -->
    <main id="readerView" class="flex-1 flex-col bg-gray-200 dark:bg-[#0f172a] h-full overflow-hidden hidden">
        <!-- Toolbar -->
        <div class="bg-white dark:bg-dark-surface border-b border-gray-300 dark:border-gray-700 p-2 flex items-center justify-between px-4 z-20 shadow-sm">
            <div class="flex items-center gap-4">
                <button id="back-btn" class="text-gray-600 dark:text-gray-300 hover:text-brand-500 flex items-center gap-2 bg-gray-100 dark:bg-gray-800 px-3 py-1.5 rounded-lg">
                    <i class="fa-solid fa-arrow-right"></i> رجوع
                </button>
                <span class="font-bold text-sm" id="current-file-name">محاضرة_التشريح.pdf</span>
            </div>

            <!-- Formatting Tools -->
            <div class="flex items-center gap-1 bg-gray-50 dark:bg-gray-800 p-1 rounded-lg border border-gray-200 dark:border-gray-600" id="format-toolbar">
                <button data-command="bold" class="w-8 h-8 rounded hover:bg-gray-200 dark:hover:bg-gray-700 flex items-center justify-center"><i class="fa-solid fa-bold"></i></button>
                <button data-command="italic" class="w-8 h-8 rounded hover:bg-gray-200 dark:hover:bg-gray-700 flex items-center justify-center"><i class="fa-solid fa-italic"></i></button>
                <button data-command="underline" class="w-8 h-8 rounded hover:bg-gray-200 dark:hover:bg-gray-700 flex items-center justify-center"><i class="fa-solid fa-underline"></i></button>
                <div class="w-px h-5 bg-gray-300 dark:bg-gray-600 mx-1"></div>
                <button data-command="justifyRight" class="w-8 h-8 rounded hover:bg-gray-200 dark:hover:bg-gray-700 flex items-center justify-center"><i class="fa-solid fa-align-right"></i></button>
                <button data-command="justifyCenter" class="w-8 h-8 rounded hover:bg-gray-200 dark:hover:bg-gray-700 flex items-center justify-center"><i class="fa-solid fa-align-center"></i></button>
                <button data-command="justifyLeft" class="w-8 h-8 rounded hover:bg-gray-200 dark:hover:bg-gray-700 flex items-center justify-center"><i class="fa-solid fa-align-left"></i></button>
                <div class="w-px h-5 bg-gray-300 dark:bg-gray-600 mx-1"></div>
                <button data-command="insertUnorderedList" class="w-8 h-8 rounded hover:bg-gray-200 dark:hover:bg-gray-700 flex items-center justify-center"><i class="fa-solid fa-list-ul"></i></button>
                <button data-command="insertOrderedList" class="w-8 h-8 rounded hover:bg-gray-200 dark:hover:bg-gray-700 flex items-center justify-center"><i class="fa-solid fa-list-ol"></i></button>
            </div>

            <button id="export-pdf-btn" class="bg-brand-500 hover:bg-brand-600 text-white px-4 py-1.5 rounded-lg text-sm font-bold flex items-center gap-2">
                <i class="fa-solid fa-download"></i> تصدير
            </button>
        </div>

        <div class="flex flex-1 overflow-hidden relative">
            <!-- Sidebar -->
            <aside class="w-16 bg-white dark:bg-dark-surface border-l border-gray-200 dark:border-gray-700 flex flex-col items-center py-4 gap-4 z-10">
                <button id="pointer-btn" class="w-10 h-10 rounded-lg bg-brand-100 text-brand-600 flex items-center justify-center"><i class="fa-solid fa-arrow-pointer"></i></button>
                <button id="highlight-btn" class="w-10 h-10 rounded-lg hover:bg-yellow-100 hover:text-yellow-600 text-gray-600 dark:text-gray-300 flex items-center justify-center"><i class="fa-solid fa-highlighter"></i></button>
                
                <div class="w-8 h-px bg-gray-200 dark:bg-gray-700 my-1"></div>
                
                <!-- Shapes -->
                <div class="relative group">
                    <button class="w-10 h-10 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-600 flex items-center justify-center"><i class="fa-regular fa-object-group"></i></button>
                    <div class="absolute right-12 top-0 bg-white dark:bg-gray-800 border border-gray-200 rounded-lg shadow-xl p-2 hidden group-hover:grid grid-cols-2 gap-2 w-24">
                        <!-- Shapes generated by JS -->
                    </div>
                </div>

                <!-- Add Page -->
                <div class="relative group">
                    <button class="w-10 h-10 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-600 flex items-center justify-center"><i class="fa-solid fa-file-circle-plus"></i></button>
                    <div class="absolute right-12 top-0 w-36 bg-white dark:bg-gray-800 border border-gray-200 rounded-lg shadow-xl p-2 hidden group-hover:flex flex-col gap-1">
                        <button class="text-xs text-right px-2 py-2 hover:bg-gray-100 rounded add-page-btn" data-type="blank"><i class="fa-regular fa-file"></i> صفحة فارغة</button>
                        <button class="text-xs text-right px-2 py-2 hover:bg-yellow-50 text-yellow-600 rounded add-page-btn" data-type="note"><i class="fa-solid fa-note-sticky"></i> ملاحظة صفراء</button>
                    </div>
                </div>
            </aside>

            <!-- PDF Container -->
            <div class="flex-1 overflow-auto flex justify-center p-8 relative" id="pdf-container">
                <div class="pdf-page p-12 outline-none font-serif text-lg" contenteditable="true" id="main-editor">
                    <!-- PDF Content will be loaded here -->
                </div>
            </div>

            <!-- Gemini Chat -->
            <button id="gemini-toggle-btn" class="gemini-btn absolute bottom-8 left-8 w-16 h-16 rounded-full text-white text-3xl flex items-center justify-center shadow-lg hover:scale-110 transition-transform z-40">
                <i class="fa-solid fa-sparkles"></i>
            </button>

            <div id="gemini-chat-panel" class="absolute bottom-28 left-8 w-96 bg-white dark:bg-gray-900 rounded-2xl shadow-2xl border border-gray-200 dark:border-gray-700 flex flex-col h-[500px] z-50 transition-all duration-300 transform scale-95 opacity-0 pointer-events-none origin-bottom-left">
                <!-- Chat Header -->
                <div class="bg-gradient-to-r from-violet-600 to-blue-500 p-4 text-white flex justify-between items-center rounded-t-2xl">
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-sparkles text-yellow-300"></i>
                        <span class="font-bold">المساعد الذكي Gemini</span>
                    </div>
                    <button id="close-gemini-btn" class="hover:text-gray-200"><i class="fa-solid fa-xmark"></i></button>
                </div>
                
                <!-- Chat Messages -->
                <div id="chat-messages" class="flex-1 overflow-y-auto p-4 flex flex-col gap-3 bg-gray-50 dark:bg-gray-800">
                    <div class="bg-white dark:bg-gray-700 p-3 rounded-xl rounded-tr-none shadow-sm text-sm border dark:border-gray-600 self-start max-w-[85%]">
                        مرحباً! أنا جاهز لمساعدتك.
                    </div>
                </div>

                <!-- Quick Actions -->
                <div class="grid grid-cols-2 gap-2 p-2 border-t dark:border-gray-700 bg-white dark:bg-gray-900" id="gemini-quick-actions">
                    <button data-action="summarize" class="text-xs p-2 rounded bg-gray-100 dark:bg-gray-800 hover:bg-violet-100 hover:text-violet-600 font-bold flex items-center gap-1"><i class="fa-solid fa-bolt text-yellow-500"></i> تلخيص ذكي</button>
                    <button data-action="explain" class="text-xs p-2 rounded bg-gray-100 dark:bg-gray-800 hover:bg-blue-100 hover:text-blue-600 font-bold flex items-center gap-1"><i class="fa-solid fa-brain text-blue-500"></i> فهم عميق</button>
                    <button data-action="translate" class="text-xs p-2 rounded bg-gray-100 dark:bg-gray-800 hover:bg-green-100 hover:text-green-600 font-bold flex items-center gap-1"><i class="fa-solid fa-language text-green-500"></i> ترجمة دقيقة</button>
                    <button data-action="quiz" class="text-xs p-2 rounded bg-gray-100 dark:bg-gray-800 hover:bg-orange-100 hover:text-orange-600 font-bold flex items-center gap-1"><i class="fa-solid fa-circle-question text-orange-500"></i> أسئلة امتحان</button>
                </div>

                <!-- Input Field -->
                <div class="p-3 border-t dark:border-gray-700 bg-gray-50 dark:bg-gray-900 flex gap-2">
                    <input type="text" id="ai-input" placeholder="اسألني أي شيء..." class="flex-1 px-3 py-2 rounded-lg border dark:border-gray-600 bg-white dark:bg-gray-800 focus:outline-none focus:border-violet-500 text-sm">
                    <button id="send-ai-btn" class="bg-violet-500 hover:bg-violet-600 text-white w-10 h-10 rounded-lg flex items-center justify-center">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
       <!-- استدعاء الملفات بدون مجلدات -->
    <script src="ui.js"></script>
    <script src="ai.js"></script>
    <script src="firebase.js"></script>
</body>
</html>
